# B站获取插件：列出你自己的收藏夹和稍后再看，按链接取单条，用于个人备份和离线阅读。
# 几种方法各列一项（usuyo 协议 §2.3.1），没做的也列；行和 usuyo 仓库 docs/platforms/routes.md 第 5 节一一对应。
protocol: 1
id: usuyo-fetch/bilibili
kind: fetch
name: B站
description: 按视频链接取元数据、封面和低画质音视频（不用账号）；列公开的收藏夹（不用账号）；列我的收藏夹和稍后再看（用账号）
version: 0.1.0
license: MIT
maintainers: [Fldicoahkiin]
platforms: [bilibili]
match: ["www.bilibili.com/video/*", "m.bilibili.com/video/*", "b23.tv/*"]
sites:
  - site: www.bilibili.com
    name: B站
    credential: cookies
    loginUrl: https://passport.bilibili.com/login
    cookies: [SESSDATA]
    domains: [".bilibili.com"]
methods:
  - id: view
    name: 公开接口
    access: public-web
    login: none
    account: none
    risk:
      text: 2026-06 起缺指纹参数的部分接口回 412
      source: {label: "BiliNote #397", url: "https://github.com/JefferyHcool/BiliNote/issues/397"}
    capabilities:
      fetch:
        timeout: 30m
        outputs: [text, images, media:video, media:audio, meta]
  - id: favorites-public
    name: 公开收藏夹
    access: public-web
    login: none
    account: none
    risk:
      text: 只有公开的收藏夹列得到；设成私密的和稍后再看要登录
      source: {label: "usuyo platforms/routes.md 第 5 节", url: "https://github.com/usuyo/usuyo/blob/main/docs/platforms/routes.md#5-b站"}
    capabilities:
      # 2026-11-12 对一个公开收藏夹实测：一页里按收藏时间从旧到新，所以不说 newest-first
      list:
        order: unordered
        link: 收藏夹或个人空间的链接
  - id: favorites
    name: 我的收藏夹和稍后再看
    access: session-api
    login: required
    account: in-usuyo
    sites: [www.bilibili.com]
    risk:
      text: 一例大会员被冻结，因果不明
      source: {label: "yutto #452", url: "https://github.com/yutto-dev/yutto/issues/452"}
    capabilities:
      list:
        order: newest-first
        sources:
          - {source: "bilibili:toview", title: 稍后再看, action: favorite}
  - id: userscript
    name: 浏览器脚本
    access: browser-session
    login: required
    account: own-browser
    delivers: links
    script: userscript/usuyo-bilibili-saved.user.js
    risk:
      text: 同类脚本（X）调研里没有处罚记录；这个脚本还没在真浏览器里跑过
      source: {label: "调研 06 §16.2", url: "https://github.com/usuyo/usuyo/blob/main/docs/research/06-platform-access-and-account-risk.md#162-issue-里的账号问题"}
  # 包你自己装的 yutto（GPL-3.0，独立进程，插件不带、不下载它）；用宿主交来的 B站登录，写进只有这次调用能读的
  # 临时认证文件，用完删掉。画面、声音分两次取，字幕跟在第一次里；层级和默认开着照 routes.md 第 5 节的 session-api
  - id: yutto
    name: yutto（高清音视频、字幕）
    access: session-api
    login: required
    account: in-usuyo
    sites: [www.bilibili.com]
    risk:
      text: B站 2026 年给接口文档、SDK、下载器的维护者发律师函，点名登录态、签名鉴权的适配
      source: {label: "调研 06 §16.3", url: "https://github.com/usuyo/usuyo/blob/main/docs/research/06-platform-access-and-account-risk.md#163-下架停更与法律风险"}
    capabilities:
      fetch:
        timeout: 1h
        outputs: [media:video, media:audio, subtitle]
  - id: mediacrawler
    name: MediaCrawler 的结果文件
    access: private-api
    login: none
    account: none
    risk:
      text: 文件是你自己用登录了你账号的 MediaCrawler 跑出来的；这种方法只读你交来的文件，不向任何平台发请求。记录到的封禁在 MediaCrawler 采集的那一侧（它的 issue 里有小红书账号被永久封禁的报告）
      source: {label: "MediaCrawler #865", url: "https://github.com/NanmiCoder/MediaCrawler/issues/865"}
    capabilities:
      list:
        order: unordered
        files: ["*.json", "*.jsonl", "*.zip"]
        reads: MediaCrawler 保存成 json 或 jsonl 的B站帖子文件（名字里带 contents；评论文件、CSV、SQLite 不读），或把 data 文件夹压成的 zip
pacing:
  bilibili: {batch: true, interval: 5s, daily: 500}
permissions:
  # 只有方法 yutto 要再起程序：yutto，和它用来把流封成 mp4、m4a 的 ffmpeg。不写进 requires.runtime：缺了它们宿主会
  # 整个插件都不调，别的方法用不着它们；缺了由 health 的检查只挡方法 yutto（协议 §3.10），版本要求也在那里查
  exec: [yutto, ffmpeg]
  fs:
    read: ["${INPUT}"]
    write: ["${OUT}"]
  network:
    mode: allowlist
    # yutto 连的主机（推断，照 usuyo plugin try 打印的被拦主机补）
    hosts: ["api.bilibili.com", "www.bilibili.com", "b23.tv", "*.bilivideo.com", "*.bilivideo.cn", "*.hdslb.com"]
run:
  command: ["${PLUGIN_DIR}/usuyo-fetch-bilibili"]
