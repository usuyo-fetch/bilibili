[package]
name = "usuyo-fetch-bilibili"
description = "usuyo 的 B站获取插件：个人备份、离线阅读"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "usuyo_fetch_bilibili"
path = "src/lib.rs"

[[bin]]
name = "usuyo-fetch-bilibili"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
url = "2.5.8"
usuyo-plugin-kit = { version = "0.0.0", path = "../../usuyo/crates/usuyo-plugin-kit" }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
usuyo-plugin = { path = "../../usuyo/crates/usuyo-plugin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
